<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CVTailor</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="nav">
    <div class="nav-logo">CV<span>Tailor</span></div>
</div>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Log in to access your CV analyses</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="auth-error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="auth-field">
                <label class="auth-label">Email</label>
                <input type="email" name="email" class="auth-input" placeholder="you@example.com" required>
            </div>
            <div class="auth-field">
                <label class="auth-label">Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="password" class="auth-input" placeholder="Your password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword('password', this)">👁</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/signup">Sign up free</a></p>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁';
    }
}
</script>
</body>
</html>
